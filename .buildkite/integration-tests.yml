on:
  pull_request: {}
  push:
    branches:
      - main

env:
  GO_VERSION: "1.26.8"

steps:
  - label: ":rocket: Deploy and call functions ({{matrix}})"
    matrix:
      - "staging/ftqa"
      - "meta-ci"
    command: |
      set -euo pipefail

      echo "--- :gear: Install sops"
      .buildkite/sops.sh install

      echo "--- :key: Decrypt secrets"
      source .buildkite/select-env-file.sh "{{matrix}}"
      /tmp/sops --input-type dotenv --output-type dotenv -d "$$ENV_FILE" > /tmp/test.env
      set -a
      source /tmp/test.env
      set +a
      rm /tmp/test.env

      echo "--- :go: Bootstrap toolchain"
      source .buildkite/install-go.sh

      echo "--- :test_tube: Deploy, call, redeploy and delete ($$CHALK_API_SERVER)"
      go test -tags e2e -v -count=1 -timeout 40m ./e2etests
    agents:
      queue: default
    timeout_in_minutes: 45
    retry:
      automatic:
        - exit_status: -1
          limit: 2
